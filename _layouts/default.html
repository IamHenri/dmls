<!DOCTYPE html>
<html lang="{{ site.lang | default: 'fr' }}" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ── Titre & description ── -->
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} · Cours de maths en ligne{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- ── Canonique ── -->
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url | replace:'index.html','' }}">

  <!-- ── Robots ── -->
  <meta name="robots" content="{% if page.noindex %}noindex, nofollow{% else %}index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1{% endif %}">

  <!-- ── Auteur & langue ── -->
  <meta name="author" content="{{ site.author.name }}">
  <meta name="language" content="fr-FR">

  <!-- ── Mots-clés (blog surtout) ── -->
  {% if page.tags %}<meta name="keywords" content="{{ page.tags | join: ', ' }}">{% endif %}

  <!-- ── Open Graph ── -->
  <meta property="og:type"        content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:site_name"   content="{{ site.title }}">
  <meta property="og:locale"      content="fr_FR">
  <meta property="og:url"         content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta property="og:title"       content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image"       content="{{ page.og_image | default: '/assets/images/og-image.jpg' | prepend: site.baseurl | prepend: site.url }}">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt"    content="{{ page.title | default: site.title }}">
  {% if page.layout == 'post' %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  <meta property="article:author"         content="{{ site.author.name }}">
  {% if page.category %}<meta property="article:section" content="{{ page.category }}">{% endif %}
  {% if page.tags %}{% for tag in page.tags %}<meta property="article:tag" content="{{ tag }}">{% endfor %}{% endif %}
  {% endif %}

  <!-- ── Twitter / X ── -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image"       content="{{ page.og_image | default: '/assets/images/og-image.jpg' | prepend: site.baseurl | prepend: site.url }}">
  <meta name="twitter:image:alt"   content="{{ page.title | default: site.title }}">

  <!-- ── Schema.org JSON-LD ── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    {% if page.layout == 'post' %}
    "@type": "BlogPosting",
    "headline": "{{ page.title | escape }}",
    "description": "{{ page.description | default: page.excerpt | strip_html | escape }}",
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
    "author": {
      "@type": "Person",
      "name": "{{ site.author.name }}",
      "url": "{{ site.url }}{{ site.baseurl }}"
    },
    "publisher": {
      "@type": "Organization",
      "name": "{{ site.title }}",
      "url": "{{ site.url }}{{ site.baseurl }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ site.url }}{{ site.baseurl }}/assets/images/logo.png"
      }
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{{ site.url }}{{ site.baseurl }}{{ page.url }}"
    },
    "image": "{{ page.og_image | default: '/assets/images/og-image.jpg' | prepend: site.baseurl | prepend: site.url }}"
    {% else %}
    "@type": "EducationalOrganization",
    "name": "{{ site.title }}",
    "description": "{{ site.description | escape }}",
    "url": "{{ site.url }}{{ site.baseurl }}",
    "logo": "{{ site.url }}{{ site.baseurl }}/assets/images/logo.png",
    "image": "{{ site.url }}{{ site.baseurl }}/assets/images/og-image.jpg",
    "telephone": "{{ site.author.phone | default: '' }}",
    "email": "{{ site.author.email }}",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "FR"
    },
    "sameAs": [
      {% if site.social.linkedin %}"{{ site.social.linkedin }}"{% endif %}
    ],
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Cours de maths & informatique en ligne",
      "itemListElement": [
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Cours particulier de mathématiques en ligne",
            "description": "Cours individuel adapté à tous les niveaux : collège, lycée, post-bac, adultes."
          },
          "price": "{{ site.tarifs.particulier_heure }}",
          "priceCurrency": "EUR"
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Cours de maths en petit groupe en ligne",
            "description": "Groupes de 2 à 5 élèves de même niveau."
          },
          "price": "{{ site.tarifs.groupe_heure }}",
          "priceCurrency": "EUR"
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Formation informatique en ligne",
            "description": "Bureautique, programmation Python, internet et outils numériques. Tous niveaux."
          },
          "price": "{{ site.tarifs.particulier_heure }}",
          "priceCurrency": "EUR"
        }
      ]
    }
    {% endif %}
  }
  </script>

  <!-- ── jekyll-seo-tag (génère sitemap, feed, vérifications Google/Bing) ── -->
  {% seo %}

  <!-- ── Performance : préconnexions ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cal.com">

  <!-- ── Polices (swap pour éviter FOIT) ── -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </noscript>

  <!-- ── Styles ── -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- ── Favicon (à créer) ── -->
  <link rel="icon"             href="{{ '/assets/images/favicon.ico' | relative_url }}">
  <link rel="icon"             href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
</head>
<body>
  {% include nav.html %}
  <main id="main-content">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
