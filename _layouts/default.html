<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <!-- Open Graph / Facebook -->
<meta property="og:type"        content="website">
<meta property="og:url"         content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
<meta property="og:title"       content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image"       content="{{ site.url }}{{ site.baseurl }}/assets/images/og-image.jpg">

<!-- Twitter/X (optionnel mais recommandé) -->
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:image"       content="{{ site.url }}{{ site.baseurl }}/assets/images/og-image.jpg">
</head>
<body>
  {% include nav.html %}
  <main>{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
